name: Tests
on: [push, pull_request]
jobs:
  learning-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: >-
          python -m pip install --only-binary :all: -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify standalone app starts with the bundled backend
        run: python -c "from h3_standalone.app import create_app; from h3_standalone.config import load_settings; app = create_app(load_settings(no_browser=True)); print('Standalone app initialized successfully')"
