name: Publish Studio image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: studio-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Studio and GPU runtime helpers
        env:
          PYTHONPATH: .:runpod
        run: |
          python -m pip install -r requirements.txt requests tqdm
          python -m unittest discover -s tests
          python -m unittest discover -s runpod/tests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: runpod/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=studio-runtime
          cache-to: type=gha,scope=studio-runtime,mode=max,ignore-error=true
          tags: ghcr.io/pandanyxis/h3-video-studio:latest
      - name: Remove superseded Studio images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          package=users/pandanyxis/packages/container/h3-video-studio
          versions=$(gh api --paginate --slurp "$package/versions?per_page=100" | jq 'add')
          jq -e --arg digest "$IMAGE_DIGEST" '
            [.[] | select(.metadata.container.tags | index("latest")) | .name] == [$digest]
          ' <<< "$versions" >/dev/null
          jq -r --arg digest "$IMAGE_DIGEST" '
            .[] | select(.name != $digest) | .id
          ' <<< "$versions" | while read -r version; do
            gh api --method DELETE "$package/versions/$version"
          done
